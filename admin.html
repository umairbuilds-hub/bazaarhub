<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Admin - BazaarHub</title>
    <style>
      :root {
        --green: #0e5c4a;
        --dark: #093d31;
        --gold: #f2a900;
        --bg: #eef3f1;
        --ink: #17302b;
        --red: #d62828;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      [hidden] {
        display: none !important;
      }
      h1 {
        font-size: 1.4rem;
      }
      .btn {
        background: var(--gold);
        color: var(--dark);
        border: 0;
        border-radius: 999px;
        padding: 10px 20px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .btn.green {
        background: var(--green);
        color: #fff;
      }
      .btn.small {
        padding: 6px 14px;
        font-size: 0.9rem;
      }
      .btn.red {
        background: var(--red);
        color: #fff;
      }
      .btn.grey {
        background: #dbe5e1;
        color: var(--ink);
      }
      input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #c5d3ce;
        border-radius: 10px;
        font: inherit;
        background: #fff;
      }

      /* Login */
      #login-box {
        max-width: 380px;
        margin: 12vh auto;
        background: #fff;
        padding: 28px;
        border-radius: 14px;
        border: 1px solid #dbe5e1;
      }
      #login-box form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 16px;
      }
      .error {
        color: var(--red);
        font-size: 0.95rem;
      }

      /* Panel */
      .top {
        background: #fff;
        border-bottom: 1px solid #dbe5e1;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .wrap {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
      }
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .tablebox {
        background: #fff;
        border: 1px solid #dbe5e1;
        border-radius: 14px;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }
      th,
      td {
        text-align: left;
        padding: 10px 14px;
        border-bottom: 1px solid #eef3f1;
      }
      th {
        background: #f6faf8;
        font-size: 0.9rem;
      }
      .tag {
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
      }
      .tag.in {
        background: #d8f0e6;
        color: var(--green);
      }
      .tag.out {
        background: #fbdcdc;
        color: var(--red);
      }
      .actions {
        display: flex;
        gap: 6px;
      }
      .empty {
        padding: 30px;
        text-align: center;
        color: #5b6f69;
      }

      /* Form box */
      dialog {
        border: 0;
        border-radius: 14px;
        padding: 24px;
        width: min(480px, 94vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      dialog form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      dialog label {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .check input {
        width: auto;
      }
      .btns {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 6px;
      }
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--dark);
        color: #fff;
        padding: 10px 20px;
        border-radius: 999px;
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Login -->
    <div id="login-box">
      <h1>Admin login</h1>
      <form id="login-form">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Password" required />
        <button class="btn green" type="submit">Log in</button>
        <p class="error" id="login-error"></p>
      </form>
    </div>

    <!-- Admin panel -->
    <div id="panel" hidden>
      <div class="top">
        <h1>BazaarHub products</h1>
        <div>
          <a
            href="index.html"
            target="_blank"
            class="btn grey small"
            style="text-decoration: none; display: inline-block"
            >View website</a
          >
          <button class="btn grey small" id="logout">Log out</button>
        </div>
      </div>

      <div class="wrap">
        <div class="tools">
          <button class="btn green" id="add-btn">+ Add product</button>
          <button class="btn grey" id="sample-btn" hidden>
            Add sample products
          </button>
        </div>

        <div class="tablebox">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Price</th>
                <th>Discount</th>
                <th>Stock</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
          <p class="empty" id="empty" hidden>
            No products yet. Click "+ Add product" to start.
          </p>
        </div>
      </div>
    </div>

    <!-- Add / edit form -->
    <dialog id="dlg">
      <form id="form">
        <h1 id="dlg-title">Add product</h1>
        <label>Name <input id="f-name" required /></label>
        <div class="row">
          <label>Category <input id="f-category" list="cats" required /></label>
          <label>Emoji icon <input id="f-icon" placeholder="🛍️" /></label>
        </div>
        <datalist id="cats"></datalist>
        <div class="row">
          <label
            >Price (Rs.) <input id="f-price" type="number" min="1" required
          /></label>
          <label
            >Discount (%)
            <input id="f-discount" type="number" min="0" max="90" value="0"
          /></label>
        </div>
        <label
          >Photo link or path
          <input id="f-image" placeholder="assets/images/product.jpg"
        /></label>
        <label>Description <textarea id="f-desc" rows="2"></textarea></label>
        <label class="check"
          ><input type="checkbox" id="f-stock" checked /> In stock</label
        >
        <div class="btns">
          <button type="button" class="btn grey" id="cancel">Cancel</button>
          <button type="submit" class="btn green">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        setDoc,
        updateDoc,
        deleteDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBRyK8RhFVfxYN8uYwljOpNJgLxTqgIp48",
        authDomain: "bazaarhub-31e50.firebaseapp.com",
        projectId: "bazaarhub-31e50",
        storageBucket: "bazaarhub-31e50.firebasestorage.app",
        messagingSenderId: "417243847111",
        appId: "1:417243847111:web:50ba81310cbb4b8ad821e2",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const productsRef = collection(db, "products");

      const $ = (id) => document.getElementById(id);
      let products = []; // list of products from the database
      let editingId = null; // id of the product being edited (null = adding new)

      const SAMPLE = [
        {
          name: "Wireless Earbuds",
          category: "Electronics",
          price: 3499,
          discount: 10,
          icon: "🎧",
          desc: "Bluetooth 5.3, 20 hours battery",
        },
        {
          name: "Smart Watch",
          category: "Electronics",
          price: 5999,
          discount: 0,
          icon: "⌚",
          desc: "AMOLED display with fitness tracking",
        },
        {
          name: "Power Bank 20000mAh",
          category: "Electronics",
          price: 4200,
          discount: 0,
          icon: "🔋",
          desc: "Fast charging, 2 USB ports",
        },
        {
          name: "Cotton Kurta",
          category: "Fashion",
          price: 2800,
          discount: 0,
          icon: "👕",
          desc: "Soft cotton for every season",
        },
        {
          name: "Lawn Suit",
          category: "Fashion",
          price: 4500,
          discount: 15,
          icon: "👗",
          desc: "3-piece printed lawn",
        },
        {
          name: "Leather Wallet",
          category: "Fashion",
          price: 1500,
          discount: 0,
          icon: "👛",
          desc: "Genuine leather, 6 card slots",
        },
        {
          name: "Non-Stick Fry Pan",
          category: "Home",
          price: 2200,
          discount: 0,
          icon: "🍳",
          desc: "28cm, works on induction",
        },
        {
          name: "LED Table Lamp",
          category: "Home",
          price: 1800,
          discount: 0,
          icon: "💡",
          desc: "3 brightness modes, USB charging",
        },
        {
          name: "Bed Sheet Set",
          category: "Home",
          price: 3200,
          discount: 0,
          icon: "🛏️",
          desc: "King size with 2 pillow covers",
        },
        {
          name: "Face Wash Combo",
          category: "Beauty",
          price: 1250,
          discount: 0,
          icon: "🧴",
          desc: "Deep cleansing for all skin types",
        },
        {
          name: "Perfume 100ml",
          category: "Beauty",
          price: 2900,
          discount: 0,
          icon: "🌸",
          desc: "Long lasting fragrance",
        },
        {
          name: "Hair Dryer",
          category: "Beauty",
          price: 3600,
          discount: 0,
          icon: "💇",
          desc: "2000W with hot and cool air",
        },
      ];

      // Safe text for HTML
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2500);
      }

      // ----- Login -----
      $("login-form").onsubmit = async (e) => {
        e.preventDefault();
        $("login-error").textContent = "";
        try {
          await signInWithEmailAndPassword(
            auth,
            $("email").value,
            $("password").value,
          );
        } catch (err) {
          $("login-error").textContent =
            "Login failed. Check your email and password.";
        }
      };

      $("logout").onclick = () => signOut(auth);

      onAuthStateChanged(auth, (user) => {
        $("login-box").hidden = !!user;
        $("panel").hidden = !user;
        if (user) loadProducts();
      });

      // ----- Load and show products -----
      async function loadProducts() {
        try {
          const snap = await getDocs(productsRef);
          products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          products.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
          render();
        } catch (err) {
          toast("Could not load products. Check the Firestore rules.");
        }
      }

      function render() {
        $("rows").innerHTML = products
          .map(
            (p) => `
          <tr>
            <td>${esc(p.icon)} <b>${esc(p.name)}</b></td>
            <td>${esc(p.category)}</td>
            <td>Rs. ${Number(p.price).toLocaleString("en-US")}</td>
            <td>${p.discount > 0 ? p.discount + "%" : "-"}</td>
            <td><button class="tag ${p.inStock === false ? "out" : "in"}" data-stock="${p.id}" style="border:0;cursor:pointer">
              ${p.inStock === false ? "Out of stock" : "In stock"}</button></td>
            <td class="actions">
              <button class="btn small green" data-edit="${p.id}">Edit</button>
              <button class="btn small red" data-del="${p.id}">Delete</button>
            </td>
          </tr>`,
          )
          .join("");
        $("empty").hidden = products.length > 0;
        $("sample-btn").hidden = products.length > 0;

        // Category suggestions in the form
        $("cats").innerHTML = [...new Set(products.map((p) => p.category))]
          .map((c) => `<option value="${esc(c)}">`)
          .join("");
      }

      // ----- Add / edit form -----
      function openForm(p) {
        editingId = p ? p.id : null;
        $("dlg-title").textContent = p ? "Edit product" : "Add product";
        $("f-name").value = p?.name || "";
        $("f-category").value = p?.category || "";
        $("f-icon").value = p?.icon || "";
        $("f-price").value = p?.price || "";
        $("f-discount").value = p?.discount || 0;
        $("f-image").value = p?.image || "";
        $("f-desc").value = p?.desc || "";
        $("f-stock").checked = p ? p.inStock !== false : true;
        $("dlg").showModal();
      }

      $("add-btn").onclick = () => openForm(null);
      $("cancel").onclick = () => $("dlg").close();

      $("form").onsubmit = async (e) => {
        e.preventDefault();
        const data = {
          name: $("f-name").value.trim(),
          category: $("f-category").value.trim(),
          icon: $("f-icon").value.trim() || "🛍️",
          price: Number($("f-price").value),
          discount: Math.min(
            90,
            Math.max(0, Number($("f-discount").value) || 0),
          ),
          image: $("f-image").value.trim(),
          desc: $("f-desc").value.trim(),
          inStock: $("f-stock").checked,
        };
        try {
          if (editingId) await setDoc(doc(db, "products", editingId), data);
          else await addDoc(productsRef, data);
          $("dlg").close();
          toast("Saved");
          loadProducts();
        } catch (err) {
          toast("Could not save. Are you logged in as the admin?");
        }
      };

      // ----- Table buttons: edit, delete, stock -----
      $("rows").onclick = async (e) => {
        const edit = e.target.closest("[data-edit]");
        const del = e.target.closest("[data-del]");
        const stock = e.target.closest("[data-stock]");

        if (edit) openForm(products.find((p) => p.id === edit.dataset.edit));

        if (del) {
          const p = products.find((x) => x.id === del.dataset.del);
          if (confirm('Delete "' + p.name + '"? This cannot be undone.')) {
            try {
              await deleteDoc(doc(db, "products", p.id));
              toast("Deleted");
              loadProducts();
            } catch (err) {
              toast("Could not delete.");
            }
          }
        }

        if (stock) {
          const p = products.find((x) => x.id === stock.dataset.stock);
          try {
            await updateDoc(doc(db, "products", p.id), {
              inStock: p.inStock === false,
            });
            loadProducts();
          } catch (err) {
            toast("Could not update stock.");
          }
        }
      };

      // ----- Add the 12 sample products (only shown when the list is empty) -----
      $("sample-btn").onclick = async () => {
        $("sample-btn").disabled = true;
        try {
          for (const p of SAMPLE)
            await addDoc(productsRef, { ...p, image: "", inStock: true });
          toast("Sample products added");
          loadProducts();
        } catch (err) {
          toast("Could not add sample products.");
        }
        $("sample-btn").disabled = false;
      };
    </script>
  </body>
</html>
