<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products - BazaarHub</title>
    <meta
      name="description"
      content="Browse electronics, fashion, home and beauty products. Search, filter and order on WhatsApp."
    />
    <meta name="theme-color" content="#0e5c4a" />
    <meta property="og:title" content="BazaarHub - Online Shop" />
    <meta
      property="og:description"
      content="Quality products with cash on delivery across Pakistan."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <header>
      <div class="wrap nav">
        <a class="logo" href="index.html">Bazaar<b>Hub</b></a>
        <button class="menu-btn" aria-label="Open menu" aria-expanded="false">
          ☰
        </button>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html" class="on">Products</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <div class="page-head">
      <div class="wrap">
        <h1>Our products</h1>
        <p>Search, filter and order on WhatsApp.</p>
      </div>
    </div>

    <main>
      <section class="shop">
        <div class="wrap">
          <div class="bar">
            <input
              id="search"
              type="search"
              placeholder="Search products..."
              aria-label="Search products"
            />
            <select id="sort" aria-label="Sort products">
              <option value="">Sort by</option>
              <option value="low">Price: low to high</option>
              <option value="high">Price: high to low</option>
            </select>
          </div>
          <div class="bar" id="chips"></div>
          <div class="grid" id="grid"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        <div class="cols">
          <div>
            <div class="logo">Bazaar<b>Hub</b></div>
            <p>Quality products with cash on delivery across Pakistan.</p>
          </div>
          <div>
            <strong>Pages</strong>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
          </div>
          <div>
            <strong>Contact</strong>
            <a href="mailto:info@yourshop.com">info@yourshop.com</a>
            <span>Lahore, Pakistan</span>
          </div>
        </div>
        <div class="copy">© 2026 BazaarHub. All rights reserved.</div>
      </div>
    </footer>

    <a
      class="wa"
      id="wa-float"
      href="#"
      target="_blank"
      rel="noopener"
      aria-label="Chat on WhatsApp"
      >💬</a
    >

    <script src="assets/app.js"></script>
  </body>
</html>
